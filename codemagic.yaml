# Independent macOS backup builder for INFINITY.
# Both providers call scripts/build_ipa.sh; only checkout/runner orchestration differs.
workflows:
  infinity-ipa-backup:
    name: INFINITY IPA (Codemagic backup)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      groups:
        - infinity-github-logs
      xcode: '26.2'
      vars:
        scheme: LiveContainer
        archive_path: archive

    when:
      changeset:
        includes:
          - .gitmodules
          - .github/build_github.sh
          - codemagic.yaml
          - scripts/run_codemagic_build.sh
          - scripts/package_codemagic_artifacts.sh
          - scripts/publish_codemagic_logs.sh
          - scripts/build_ipa.sh
          - scripts/prepare_livecontainer_dependencies.sh
          - scripts/prepare_stikjit_idevice.sh
          - scripts/prepare_infinity_app_icon.sh
          - Branding/INFINITY-AppIcon.svg
          - LiveContainerSwiftUI/**
          - LiveContainer/**
          - LiveProcess/**
          - ShareExtension/**
          - LaunchAppExtension/**
          - MultitaskSupport/**
          - SideStoreSupport/**
          - ZSign/**
          - FrameGeneration/**
          - Resources/**
          - LiveContainer.xcodeproj/**
          - Scripts/embed-jit-helper.py
          - Vendor/StikJIT/**

    scripts:
      - name: Restore pinned Git submodules
        script: |
          set -uo pipefail
          LOG_DIR=/tmp/infinity-codemagic-logs
          mkdir -p "$LOG_DIR"
          SUBMODULE_LOG="$LOG_DIR/submodules.log"
          : > "$SUBMODULE_LOG"
          set +e
          (
            set -euo pipefail
            export GIT_TERMINAL_PROMPT=0
            git submodule sync --recursive
            max_attempts=5
            attempt=1
            while [ "$attempt" -le "$max_attempts" ]; do
              echo "Submodule restore attempt $attempt/$max_attempts"
              if git -c http.version=HTTP/1.1 \
                -c http.lowSpeedLimit=1000 \
                -c http.lowSpeedTime=30 \
                submodule update --init --recursive; then
                break
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "Submodule restore failed after $max_attempts attempts." >&2
                git submodule status --recursive || true
                exit 1
              fi
              delay=$((attempt * 15))
              echo "Transient submodule/network failure; retrying in ${delay}s."
              sleep "$delay"
              attempt=$((attempt + 1))
            done
            git submodule status --recursive
            if git submodule status --recursive | grep -E '^[+-U]'; then
              echo "Submodules are not at their superproject-pinned revisions." >&2
              exit 1
            fi
          ) 2>&1 | tee "$SUBMODULE_LOG"
          SUBMODULE_STATUS=${PIPESTATUS[0]}
          exit "$SUBMODULE_STATUS"

      - name: Run canonical INFINITY build pipeline
        script: |
          set -euo pipefail
          bash scripts/run_codemagic_build.sh

      - name: Package three separate ZIP artifacts
        script: |
          set -euo pipefail
          bash scripts/package_codemagic_artifacts.sh

    artifacts:
      - LiveContainer.ipa
      - INFINITY-LiveContainer-Only.zip
      - INFINITY-LiveContainer-SideStore.zip
      - INFINITY-Complete-Artifacts.zip
