name: INFINITY Strata SwiftUI runtime integration build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strata-swiftui-framework:
    name: Compile Strata SwiftUI framework with INFINITY runtime linked
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Select the same pinned Xcode used by the canonical IPA builder
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Check out INFINITY main and Strata submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Resolve Xcode package dependencies
        run: |
          set -euo pipefail
          PACKAGE_CACHE="$RUNNER_TEMP/infinity-source-packages"
          mkdir -p "$PACKAGE_CACHE"
          xcodebuild -resolvePackageDependencies \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -clonedSourcePackagesDirPath "$PACKAGE_CACHE"

      - name: Build only the LiveContainerSwiftUI framework target
        run: |
          set -o pipefail
          PACKAGE_CACHE="$RUNNER_TEMP/infinity-source-packages"
          xcodebuild \
            -project LiveContainer.xcodeproj \
            -target LiveContainerSwiftUI \
            -sdk iphoneos \
            -configuration Debug \
            -clonedSourcePackagesDirPath "$PACKAGE_CACHE" \
            -SYMROOT="$RUNNER_TEMP/infinity-strata-products" \
            -OBJROOT="$RUNNER_TEMP/infinity-strata-objects" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            -jobs 1 \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/infinity-strata-framework.log"
