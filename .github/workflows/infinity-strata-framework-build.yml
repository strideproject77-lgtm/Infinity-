name: INFINITY Strata SwiftUI runtime integration build

on:
  push:
    branches: [main]
    paths:
      - "LiveContainer.xcodeproj/project.pbxproj"
      - "LiveContainerSwiftUI/Strata3/INFINITYHuskRuntime.swift"
      - "LiveContainerSwiftUI/Strata3/INFINITYHuskRuntimeBridge.h"
      - "LiveContainerSwiftUI/LiveContainerSwiftUI-Bridging-Header.h"
      - "Vendor/Husk/Package.swift"
      - "Vendor/Husk/include/**"
      - "Vendor/Husk/bridge/**"
      - "Vendor/Husk/translation-layer/**"
      - "Vendor/Husk/translation-layer-next/**"
      - ".github/workflows/infinity-strata-framework-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strata-swiftui-framework:
    name: Compile Strata SwiftUI framework with INFINITY runtime linked
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Select the same modern Xcode used by the existing builder
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'

      - name: Check out INFINITY main and Strata submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Resolve Xcode package dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project LiveContainer.xcodeproj

      - name: Build only the LiveContainerSwiftUI framework target
        run: |
          set -o pipefail
          xcodebuild \
            -project LiveContainer.xcodeproj \
            -target LiveContainerSwiftUI \
            -sdk iphoneos \
            -configuration Debug \
            -SYMROOT="$RUNNER_TEMP/infinity-strata-products" \
            -OBJROOT="$RUNNER_TEMP/infinity-strata-objects" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/infinity-strata-framework.log"
