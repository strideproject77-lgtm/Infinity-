name: INFINITY Husk ANGLE iOS graphics runtime

on:
  workflow_dispatch:
    paths:
      - "Vendor/Husk/build-support/build_angle_ios.sh"
      - ".github/workflows/infinity-husk-angle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-angle:
    name: Build ANGLE for iOS arm64 (no app or IPA)
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Select Xcode used by the existing project builder
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.2"

      - name: Check out pinned INFINITY source
        uses: actions/checkout@v6

      - name: Build pinned WebKit ANGLE for iOS arm64
        run: |
          set -euo pipefail
          bash Vendor/Husk/build-support/build_angle_ios.sh

      - name: Validate the staged graphics library and notices
        run: |
          set -euo pipefail
          DYLIB="Vendor/Husk/build/ios-arm64/sysroot/lib/libANGLE-shared.dylib"
          test -s "$DYLIB"
          test -s "Vendor/Husk/build/ios-arm64/sysroot/LICENSE-ANGLE.txt"
          test -s "Vendor/Husk/build/ios-arm64/sysroot/WEBKIT_REVISION.txt"
          file "$DYLIB"
          lipo -info "$DYLIB"
          otool -D "$DYLIB"

      - name: Vendor the verified ANGLE dependency on main
        run: |
          set -euo pipefail
          DEST="Vendor/Husk/Prebuilt/ANGLE/ios-arm64"
          mkdir -p "$DEST"
          cp -R Vendor/Husk/build/ios-arm64/sysroot/. "$DEST/"
          cat > "$DEST/BUILD_PROVENANCE.md" <<'EOF'
          # ANGLE iOS arm64 prebuilt

          Built from the pinned WebKit/ANGLE source revision recorded in WEBKIT_REVISION.txt
          by .github/workflows/infinity-husk-angle.yml. LICENSE-ANGLE.txt is retained beside
          the binary. This is a dynamically loaded iOS arm64 library, not an IPA.
          The Strata app target must embed it in Frameworks with CodeSignOnCopy.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then
            echo "ANGLE prebuilt is already current."
            exit 0
          fi
          git commit -m "Vendor verified ANGLE iOS arm64 runtime"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo "Unable to publish ANGLE prebuilt to main after three attempts." >&2
          exit 1

      - name: Publish ANGLE build artifact (no IPA)
        uses: actions/upload-artifact@v4
        with:
          name: infinity-angle-ios-arm64
          path: |
            Vendor/Husk/build/ios-arm64/sysroot/lib/libANGLE-shared.dylib
            Vendor/Husk/build/ios-arm64/sysroot/include/
            Vendor/Husk/build/ios-arm64/sysroot/LICENSE-ANGLE.txt
            Vendor/Husk/build/ios-arm64/sysroot/WEBKIT_REVISION.txt
          if-no-files-found: error
          retention-days: 14
