name: INFINITY Husk iOS static runtime build

on:
  workflow_dispatch:
    paths:
      - "Vendor/Husk/Package.swift"
      - "Vendor/Husk/include/**"
      - "Vendor/Husk/bridge/**"
      - "Vendor/Husk/translation-layer/**"
      - "Vendor/Husk/translation-layer-next/**"
      - "LiveContainerSwiftUI/Strata3/INFINITYHuskRuntimeBridge.h"
      - ".github/workflows/infinity-husk-package-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-static-runtime:
    name: Build Husk translation runtime static library (no app or IPA)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out INFINITY main
        uses: actions/checkout@v4

      - name: Validate Swift package manifest
        working-directory: Vendor/Husk
        run: |
          swift package dump-package > "$RUNNER_TEMP/infinity-husk-package.json"
          swift package describe

      - name: Resolve generated package scheme
        id: scheme
        working-directory: Vendor/Husk
        run: |
          xcodebuild -list -json > "$RUNNER_TEMP/infinity-husk-xcode-list.json"
          SCHEME="$(python3 - "$RUNNER_TEMP/infinity-husk-xcode-list.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          def find_schemes(value):
              if isinstance(value, dict):
                  schemes = value.get("schemes")
                  if isinstance(schemes, list) and schemes:
                      return schemes
                  for child in value.values():
                      found = find_schemes(child)
                      if found:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found = find_schemes(child)
                      if found:
                          return found
              return []
          schemes = find_schemes(data)
          if not schemes:
              raise SystemExit("xcodebuild did not report a Swift package scheme: " + json.dumps(data))
          print(schemes[0])
          PY
          )"
          test -n "$SCHEME"
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Building scheme: $SCHEME"

      - name: Compile and archive static runtime target for iOS SDK
        working-directory: Vendor/Husk
        run: |
          set -o pipefail
          xcodebuild \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/infinity-husk-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/infinity-husk-build.log"

      - name: Verify arm64 aggregate object and INFINITY bridge symbols
        working-directory: Vendor/Husk
        run: |
          OBJECT="$RUNNER_TEMP/infinity-husk-derived/Build/Products/Debug-iphoneos/HuskTranslationRuntime.o"
          test -s "$OBJECT"
          file "$OBJECT" | tee "$RUNNER_TEMP/infinity-husk-object-file.txt"
          grep -q "Mach-O 64-bit object arm64" "$RUNNER_TEMP/infinity-husk-object-file.txt"
          xcrun nm -g "$OBJECT" | grep -q "_infinity_husk_launch_engine"
          xcrun nm -g "$OBJECT" | grep -q "_infinity_husk_prepare_java"
          xcrun nm -g "$OBJECT" | grep -q "_infinity_husk_prepare_jitless"
          xcrun nm -g "$OBJECT" | grep -q "_infinity_husk_configure_jitless"

