name: INFINITY native tests

on:
  push:
    branches: [main]
    paths:
      - "LiveContainerSwiftUI/Strata3/INFINITYAPKArchive.c"
      - "LiveContainerSwiftUI/Strata3/INFINITYAPKArchive.h"
      - "LiveContainerSwiftUI/Strata3/INFINITYAPKInspection.swift"
      - "LiveContainerSwiftUI/Strata3/INFINITYAPKManifest.swift"
      - "LiveContainerSwiftUI/Strata3/INFINITYHuskRuntimeBridge.h"
      - "LiveContainerSwiftUI/LiveContainerSwiftUI-Bridging-Header.h"
      - "scripts/import_husk_runtime.sh"
      - "scripts/audit_husk_runtime.py"
      - "tests/test_infinity_apk_archive.py"
      - "tests/test_husk_import_pipeline.py"
      - ".github/workflows/infinity-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-parser-tests:
    name: Source contract and APK archive tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate importer shell syntax
        run: bash -n scripts/import_husk_runtime.sh
      - name: Run source contract and ZIP extraction regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate audit script syntax
        run: python -m py_compile scripts/audit_husk_runtime.py


  husk-bridge-header-check:
    name: Swift to Husk bridge header check
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Type-check imported Husk C API declarations
        run: |
          cat > /tmp/INFINITYHuskBridgeSmoke.swift <<'SWIFT'
          import Foundation
          let _ = HUSK_UNITY_IDLE
          let _ = HUSK_UNITY_RUNNING
          SWIFT
          swiftc -typecheck \
            -import-objc-header LiveContainerSwiftUI/Strata3/INFINITYHuskRuntimeBridge.h \
            /tmp/INFINITYHuskBridgeSmoke.swift

  swift-typecheck:
    name: Swift APK parser type-check
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Type-check APK inspection and manifest parser
        run: |
          swiftc -typecheck \
            -import-objc-header LiveContainerSwiftUI/Strata3/INFINITYAPKArchive.h \
            LiveContainerSwiftUI/Strata3/INFINITYAPKManifest.swift \
            LiveContainerSwiftUI/Strata3/INFINITYAPKInspection.swift
