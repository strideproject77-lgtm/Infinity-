name: INFINITY native tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "LiveContainerSwiftUI/Strata3/INFINITYAPKArchive.c"
      - "LiveContainerSwiftUI/Views/LiveBoardBuiltInJIT.swift"
      - "LiveContainerSwiftUI/Views/LiveBoardJITSetup.swift"
      - "LiveContainerSwiftUI/Views/StrataJITHandoff.swift"
      - "LiveContainerSwiftUI/Views/StrataPairingRecord.swift"
      - "LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift"
      - "LiveContainerSwiftUI/Models/LCAppModel.swift"
      - "LiveContainerSwiftUI/Strata3/StrataRuntimeCenter.swift"
      - "LiveContainerSwiftUI/Strata3/INFINITYVersion.swift"
      - "LiveContainerSwiftUI/Strata3/INFINITYVersion.swift"
      - "LiveContainerSwiftUI/Utilities/LCUtils.h"
      - "LiveContainerSwiftUI/Utilities/LCUtils.m"
      - "ShareExtension/StrataJITWorker.swift"
      - "ShareExtension/ShareExtensionHandler.swift"
      - "LiveProcess/StrataJITGuestGate.h"
      - "LiveProcess/StrataJITGuestGate.m"
      - "LiveProcess/main.m"
      - "LiveContainer/LCSharedUtils.m"
      - "Scripts/embed-jit-helper.py"
      - "tests/test_strata_builtin_jit.py"
      - "LiveContainerSwiftUI/Strata3/INFINITYAPKArchive.h"
      - "LiveContainerSwiftUI/Strata3/INFINITYAPKInspection.swift"
      - "LiveContainerSwiftUI/Strata3/INFINITYAPKManifest.swift"
      - "LiveContainerSwiftUI/Strata3/INFINITYHuskRuntimeBridge.h"
      - "LiveContainerSwiftUI/Strata3/INFINITYHuskRuntime.swift"
      - "LiveContainerSwiftUI/Strata3/INFINITYHuskNativeLog.swift"
      - "LiveContainerSwiftUI/Strata3/INFINITYJITLess.swift"
      - "LiveContainerSwiftUI/Strata3/INFINITYAPKStore.swift"
      - "LiveContainerSwiftUI/Strata3/INFINITYAPKLaunchView.swift"
      - "Vendor/Husk/include/**"
      - "Vendor/Husk/bridge/**"
      - "Vendor/Husk/translation-layer-next/**"
      - "Vendor/Husk/Package.swift"
      - "Vendor/Husk/build-support/build_angle_ios.sh"
      - "Vendor/Husk/src/java-framework/build.sh"
      - "LiveContainerSwiftUI/LiveContainerSwiftUI-Bridging-Header.h"
      - "scripts/import_husk_runtime.sh"
      - "scripts/prepare_stikjit_idevice.sh"
      - "scripts/build_infinity_runtime_assets.sh"
      - ".github/workflows/infinity-runtime-assets.yml"
      - ".github/workflows/infinity-husk-angle.yml"
      - "scripts/audit_husk_runtime.py"
      - "scripts/test-portable-core.sh"
      - ".github/workflows/infinity-cross-platform-core.yml"
      - "tests/test_apk_store_contract.py"
      - "tests/test_infinity_apk_archive.py"
      - "tests/test_husk_import_pipeline.py"
      - "tests/test_husk_runtime_bridge.py"
      - "tests/test_2048_compatibility_contract.py"
      - "docs/compatibility/2048-tpcstld.md"
      - "tests/test_husk_jitless.py"
      - "tests/test_runtime_assets_builder.py"
      - ".github/workflows/infinity-tests.yml"
      - ".github/workflows/infinity-strata-framework-build.yml"
      - "tests/test_strata_framework_workflow.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-parser-tests:
    name: Source contract and APK archive tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate runtime build scripts
        run: |
          bash -n scripts/import_husk_runtime.sh
          bash -n scripts/prepare_stikjit_idevice.sh
          bash -n scripts/build_infinity_runtime_assets.sh
          bash -n Vendor/Husk/build-support/build_angle_ios.sh
          bash -n Vendor/Husk/src/java-framework/build.sh
      - name: Run source contract and ZIP extraction regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate audit script syntax
        run: python -m py_compile scripts/audit_husk_runtime.py


  husk-bridge-header-check:
    name: Swift to Husk bridge header check
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Type-check imported Husk C API declarations
        run: |
          cat > /tmp/INFINITYHuskBridgeSmoke.swift <<'SWIFT'
          import Foundation
          // The production LCPath lives in Shared.swift alongside app-wide UI models.
          // This narrow smoke target only needs its document-root URL contract.
          struct LCPath {
              static let docPath = FileManager.default.temporaryDirectory
          }
          func infinityBridgeSmoke() {
              _ = INFINITY_HUSK_IDLE
              _ = INFINITY_HUSK_RUNNING
              _ = infinity_husk_get_state()
              _ = infinity_husk_frames()
              _ = infinity_husk_launch_java(nil, nil, nil, 0, 0, nil, nil)
              _ = infinity_husk_prepare_java(nil, 1.0, nil, nil, nil, nil, false)
          }
          SWIFT
          cat > /tmp/INFINITYHuskBridgeSmoke.h <<HEADER
          #include "${GITHUB_WORKSPACE}/LiveContainerSwiftUI/Strata3/INFINITYAPKArchive.h"
          #include "${GITHUB_WORKSPACE}/LiveContainerSwiftUI/Strata3/INFINITYHuskRuntimeBridge.h"
          HEADER
          swiftc -typecheck \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -target arm64-apple-ios15.0 \
            -import-objc-header /tmp/INFINITYHuskBridgeSmoke.h \
            LiveContainerSwiftUI/Strata3/INFINITYHuskRuntime.swift \
            LiveContainerSwiftUI/Strata3/INFINITYHuskNativeLog.swift \
            LiveContainerSwiftUI/Strata3/INFINITYAPKStore.swift \
            LiveContainerSwiftUI/Strata3/INFINITYAPKInspection.swift \
            LiveContainerSwiftUI/Strata3/INFINITYAPKManifest.swift \
            LiveContainerSwiftUI/Strata3/INFINITYJITLess.swift \
            /tmp/INFINITYHuskBridgeSmoke.swift
          swiftc -typecheck \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -target arm64-apple-ios15.0 \
            -import-objc-header /tmp/INFINITYHuskBridgeSmoke.h \
            LiveContainerSwiftUI/Strata3/INFINITYJITLess.swift

  husk-c-header-check:
    name: Husk C bridge header syntax check (Linux)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate exported C headers with Clang
        run: |
          printf '%s\n' \
            '#include "LiveContainerSwiftUI/Strata3/INFINITYAPKArchive.h"' \
            '#include "LiveContainerSwiftUI/Strata3/INFINITYHuskRuntimeBridge.h"' \
            | clang -x c -std=c11 -fsyntax-only -I . -I Vendor/Husk/include -
  swift-typecheck:
    name: Swift APK parser type-check (Linux)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Type-check APK inspection and manifest parser
        run: |
          swiftc -typecheck \
            tests/fixtures/INFINITYAPKArchiveLinuxShim.swift \
            LiveContainerSwiftUI/Strata3/INFINITYVersion.swift \
            LiveContainerSwiftUI/Strata3/INFINITYAPKManifest.swift \
            LiveContainerSwiftUI/Strata3/INFINITYAPKInspection.swift
