name: Import Husk Runtime Sources

on:
  push:
    branches: [main]
    paths:
      - "scripts/import_husk_runtime.sh"
      - "scripts/audit_husk_runtime.py"
      - ".github/workflows/import-husk-runtime.yml"
  workflow_dispatch:
    inputs:
      refresh:
        description: Replace the currently vendored snapshot (review the pinned revision first)
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: husk-runtime-import-main
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Import pinned Husk runtime sources
        run: |
          if [ "${{ inputs.refresh }}" = "true" ]; then
            bash scripts/import_husk_runtime.sh --refresh
          else
            bash scripts/import_husk_runtime.sh
          fi

      - name: Generate source and dependency inventory
        run: python3 scripts/audit_husk_runtime.py

      - name: Commit imported source and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Vendor/Husk docs/generated/HUSK_SOURCE_MANIFEST.json docs/generated/HUSK_SOURCE_AUDIT.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Vendor pinned Husk runtime sources and audit dependencies"
          git push origin HEAD:main
