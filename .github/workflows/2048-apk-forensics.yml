name: 2048 APK forensic audit

on:
  push:
    paths:
      - "scripts/inspect_2048_apk.py"
      - "tests/test_2048_apk_forensics.py"
      - "docs/compatibility/2048-tpcstld.md"
      - ".github/workflows/2048-apk-forensics.yml"
  pull_request:
    paths:
      - "scripts/inspect_2048_apk.py"
      - "tests/test_2048_apk_forensics.py"
      - "docs/compatibility/2048-tpcstld.md"
      - ".github/workflows/2048-apk-forensics.yml"

permissions:
  contents: read

jobs:
  inspect-upstream-apk:
    name: Inspect upstream 2048 v1.3.3 APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out INFINITY
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Android SDK build-tools
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;35.0.0"
      - name: Run focused APK forensic regression tests
        run: |
          python -m py_compile scripts/inspect_2048_apk.py
          python -m unittest discover -s tests -p "test_2048_apk_forensics.py" -v
      - name: Download the pinned upstream distributable
        run: |
          mkdir -p "$RUNNER_TEMP/2048-apk" "$RUNNER_TEMP/2048-report"
          curl --fail --location --retry 3 \
            "https://github.com/tpcstld/2048/releases/download/1.3.3/133-release.apk" \
            --output "$RUNNER_TEMP/2048-apk/133-release.apk"
          sha256sum "$RUNNER_TEMP/2048-apk/133-release.apk"
      - name: Inspect manifest, resources, DEX headers and bytecode
        run: |
          python scripts/inspect_2048_apk.py \
            "$RUNNER_TEMP/2048-apk/133-release.apk" \
            --output "$RUNNER_TEMP/2048-report" \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --dexdump "$ANDROID_HOME/build-tools/35.0.0/dexdump"
      - name: Print forensic report summary
        run: |
          cat "$RUNNER_TEMP/2048-report/REPORT.md"
          python -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"2048-report/report.json").read_text()); print("Manifest facts:", {k:r[k] for k in ("min_sdk","target_sdk","compile_sdk","launch_activity","android_support_version")}); print("DEX inventory:", {k: {x:v[x] for x in ("class_defs_size","method_ids_size","field_ids_size")} for k,v in r["dex_headers"].items()}); print("DEX disassembly facts:", {k: {x:v[x] for x in ("class_descriptor_count","main_activity_superclass","android_framework_method_ref_count")} for k,v in r["dex_disassembly_facts"].items()}); print("Framework method refs:", *next(iter(r["dex_disassembly_facts"].values()))["android_framework_method_refs"][:120], sep="\\n"); print("Dependency class descriptor counts:", r["dependency_class_descriptor_counts"])'
      - name: Publish forensic report
        uses: actions/upload-artifact@v4
        with:
          name: 2048-v1.3.3-apk-forensic-report
          path: |
            ${{ runner.temp }}/2048-report/REPORT.md
            ${{ runner.temp }}/2048-report/report.json
            ${{ runner.temp }}/2048-report/*.txt
          if-no-files-found: error
          retention-days: 30
