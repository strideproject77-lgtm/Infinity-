name: INFINITY Husk Java framework DEX build

on:
  push:
    branches: [main]
    paths:
      - "Vendor/Husk/src/java-framework/**"
      - "Vendor/Husk/translation-layer-next/husk-tl-dvm-gles20.c"
      - "Vendor/Husk/tools/compat/**"
      - "Vendor/Husk/src/java-framework/build.sh"
      - ".github/workflows/infinity-husk-java-framework.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-framework-dex:
    name: Compile Android Java framework DEX (no APK or IPA)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out pinned INFINITY sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download pinned D8 tool
        env:
          R8_VERSION: "8.13.25"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://dl.google.com/dl/android/maven2/com/android/tools/r8/${R8_VERSION}/r8-${R8_VERSION}.jar" \
            --output "$RUNNER_TEMP/r8.jar"
          jar tf "$RUNNER_TEMP/r8.jar" | grep -q '^com/android/tools/r8/D8.class$'
          echo "D8 tool verified: R8 ${R8_VERSION}"

      - name: Build Husk Java framework DEX
        run: |
          set -euo pipefail
          HUSK_JDK="$JAVA_HOME" \
          HUSK_D8="$RUNNER_TEMP/r8.jar" \
            bash Vendor/Husk/src/java-framework/build.sh "$RUNNER_TEMP/husk-framework.dex"
          test -s "$RUNNER_TEMP/husk-framework.dex"
          test -s "$RUNNER_TEMP/husk-framework-core.dex"
          ls -lh "$RUNNER_TEMP/husk-framework.dex" "$RUNNER_TEMP/husk-framework-core.dex"

      - name: Publish generated DEX build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: husk-java-framework-dex
          path: |
            ${{ runner.temp }}/husk-framework.dex
            ${{ runner.temp }}/husk-framework-core.dex
          if-no-files-found: error
          retention-days: 14
