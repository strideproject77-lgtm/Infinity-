name: Bootstrap Codemagic log secret

on:
  workflow_dispatch:
    inputs:
      codemagic_app_id:
        description: "Codemagic app ID from the app settings URL"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: codemagic-log-secret-bootstrap
  cancel-in-progress: false

jobs:
  create-app-variable-group:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create app-level group and import the existing GitHub token secret
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          INFINITY_LOGS_GITHUB_TOKEN: ${{ secrets.INFINITY_LOGS_GITHUB_TOKEN }}
          CODEMAGIC_APP_ID: ${{ inputs.codemagic_app_id }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CODEMAGIC_API_TOKEN:-}" ]]; then
            echo "::error::Missing GitHub Actions secret CODEMAGIC_API_TOKEN."
            exit 1
          fi
          if [[ -z "${INFINITY_LOGS_GITHUB_TOKEN:-}" ]]; then
            echo "::error::Missing GitHub Actions secret INFINITY_LOGS_GITHUB_TOKEN."
            exit 1
          fi
          if [[ ! "${CODEMAGIC_APP_ID}" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::The Codemagic app ID format is invalid."
            exit 1
          fi

          api="https://codemagic.io/api/v3"
          headers=(-H "Accept: application/json" -H "Content-Type: application/json" -H "x-auth-token: ${CODEMAGIC_API_TOKEN}")

          groups_file="$(mktemp)"
          trap 'rm -f "$groups_file"' EXIT
          curl --fail-with-body --silent --show-error "${headers[@]}" \
            "$api/apps/$CODEMAGIC_APP_ID/variable-groups?page_size=100" \
            -o "$groups_file"

          group_id="$(jq -r '.variableGroups[]? | select(.name == "infinity-github-logs") | .id // ._id' "$groups_file" | head -n 1)"
          if [[ -z "$group_id" || "$group_id" == "null" ]]; then
            payload="$(jq -n --arg name "infinity-github-logs" '{name: $name}')"
            created="$(curl --fail-with-body --silent --show-error "${headers[@]}" \
              --data "$payload" \
              -X POST "$api/apps/$CODEMAGIC_APP_ID/variable-groups")"
            group_id="$(jq -r '.id // ._id // .variableGroup.id // .variableGroup._id // empty' <<<"$created")"
          fi

          if [[ -z "$group_id" || "$group_id" == "null" ]]; then
            echo "::error::Codemagic did not return a variable-group ID. No secret was imported."
            exit 1
          fi

          variables_file="$(mktemp)"
          trap 'rm -f "$groups_file" "$variables_file"' EXIT
          curl --fail-with-body --silent --show-error "${headers[@]}" \
            "$api/variable-groups/$group_id/variables?page_size=100" \
            -o "$variables_file"

          variable_id="$(jq -r '.variables[]? | select(.name == "INFINITY_LOGS_GITHUB_TOKEN") | .id // ._id' "$variables_file" | head -n 1)"
          if [[ -n "$variable_id" && "$variable_id" != "null" ]]; then
            payload="$(jq -n --arg value "$INFINITY_LOGS_GITHUB_TOKEN" '{value: $value, secure: true}')"
            curl --fail-with-body --silent --show-error "${headers[@]}" \
              --data "$payload" -X PATCH \
              "$api/variable-groups/$group_id/variables/$variable_id" >/dev/null
            echo "Updated the existing secure Codemagic log variable."
          else
            payload="$(jq -n --arg value "$INFINITY_LOGS_GITHUB_TOKEN" \
              '{secure: true, variables: [{name: "INFINITY_LOGS_GITHUB_TOKEN", value: $value}]}')"
            curl --fail-with-body --silent --show-error "${headers[@]}" \
              --data "$payload" -X POST \
              "$api/variable-groups/$group_id/variables" >/dev/null
            echo "Created the secure Codemagic log variable."
          fi

          echo "Codemagic app-level variable group is ready: infinity-github-logs"
          echo "Secret value was not printed."
